name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Production build
        env:
          VITE_API_URL: https://multicommerce-api.vercel.app/api
        run: npm run build

  backend:
    name: Backend — install, syntax & smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check entrypoints
        run: |
          node --check server.js
          node --check configs/database.js
          node --check configs/envConfig.js
          node --check routers/index.js

      - name: Verify package starts (dry import)
        run: node -e "import('./server.js').then(() => console.log('server module ok')).catch((e) => { console.error(e); process.exit(1); })"
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/ci-smoke
          JWT_TOKEN_SECRET: ci_jwt_access_secret_min_32_chars
          JWT_REFRESH_SECRET: ci_jwt_refresh_secret_min_32
          CLIENT_URL: http://localhost:5173
          VERCEL: "1"

      - name: Run unit + API smoke tests
        run: npm test
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/ci-smoke
          JWT_TOKEN_SECRET: ci_jwt_access_secret_min_32_chars_xx
          JWT_REFRESH_SECRET: ci_jwt_refresh_secret_min_32_chars
          CLIENT_URL: http://localhost:5173
          VERCEL: "1"
